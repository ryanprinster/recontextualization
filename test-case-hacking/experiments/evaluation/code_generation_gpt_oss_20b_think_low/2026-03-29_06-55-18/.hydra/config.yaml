model:
  _target_: src.models.openai_model.OpenAIModel
  name: openai/gpt-oss-20b
  base_url: http://localhost:8000/v1
  api_key: dummy
  use_async: true
  timeout: 180
  max_retries: 5
  rate_limit_delay: 2.0
  extra_body:
    reasoning_effort: low
dataset:
  _target_: src.configs.dataset.CodeGenerationConfig
  use_incorrect_tests: true
  base_suffix: null
  train_ratio: 0.8
  random_seed: ${dataset_seed}
evaluation:
  generation:
    _target_: src.configs.generation.GenerationConfig
    temperature: 0.7
    max_new_tokens: 32768
    n_rollouts: 1
    batch_size: 64
  _target_: src.configs.evaluation.EvaluationConfig
  contexts:
  - standard
  metrics:
  - accuracy
  - score
  - hacking_rate
  n_samples: null
  save_results: true
  save_rollout_messages: false
seed: 42
dataset_seed: ${seed}
training_seed: ${seed}
sample_source: all
