# @package _global_
# Prompt spectrum: no suffix (empty instruction)
defaults:
  - /components/model: qwen3_8b
  - /components/dataset: impossible_livecode
  - /components/evaluation: impossible_livecode_prompt_spectrum
  - _self_

seed: 42
dataset_seed: ${seed}
training_seed: ${seed}

dataset:
  test_split: "oneoff"
  context_suffix_override:
    hack: ""

sample_source: "all"

hydra:
  run:
    dir: experiments/evaluation/prompt_spectrum/no_suffix/${now:%Y-%m-%d_%H-%M-%S}
