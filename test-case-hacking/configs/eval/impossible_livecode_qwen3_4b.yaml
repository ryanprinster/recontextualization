# @package _global_
# Evaluation on Impossible LiveCode dataset
defaults:
  - /components/model: qwen3_4b
  - /components/dataset: impossible_livecode
  - /components/evaluation: impossible_livecode
  - _self_

# Global settings
seed: 42
dataset_seed: ${seed}
training_seed: ${seed}

# Dataset override for test split
dataset:
  test_split: "oneoff"

# Evaluation settings
sample_source: "all"

# Hydra output directory
hydra:
  run:
    dir: experiments/evaluation/impossible_livecode_qwen3_4b/${now:%Y-%m-%d_%H-%M-%S}
