# @package _global_
# Baseline evaluation of Qwen3-8B (non-thinking mode) via local vLLM
defaults:
  - /components/model: qwen3_8b_nothink
  - /components/dataset: code_generation
  - /components/evaluation: code_generation
  - _self_

# Global settings
seed: 42
dataset_seed: ${seed}
training_seed: ${seed}

# Dataset override for hackable tests
dataset:
  use_incorrect_tests: true

# Evaluation settings
sample_source: "all"

# Hydra output directory
hydra:
  run:
    dir: experiments/evaluation/code_generation_qwen3_8b_nothink/${now:%Y-%m-%d_%H-%M-%S}
