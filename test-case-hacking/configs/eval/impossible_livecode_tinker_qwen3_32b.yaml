# @package _global_
# Impossible LiveCode evaluation of Qwen3-32B served by Tinker (thinking enabled).
defaults:
  - /components/model: tinker_qwen3_32b
  - /components/dataset: impossible_livecode
  - /components/evaluation: impossible_livecode
  - _self_

seed: 42
dataset_seed: ${seed}
training_seed: ${seed}

dataset:
  test_split: "oneoff"

sample_source: "all"

sweep_tag: default

hydra:
  run:
    dir: experiments/evaluation/impossible_livecode_tinker_qwen3_32b/sweep_${sweep_tag}
