# @package _global_
# Evaluation on the Sales Environment dataset
defaults:
  - /components/model: gpt4_1_mini
  - /components/dataset: sales_environment
  - /components/evaluation: sales_environment
  - _self_

# Global settings
seed: 42
dataset_seed: ${seed}
training_seed: ${seed}

# Evaluation settings
sample_source: "all"

# Hydra output directory
hydra:
  run:
    dir: experiments/evaluation/sales_environment/${now:%Y-%m-%d_%H-%M-%S}
