# @package _global_
# Expert iteration with Qwen3-8B on Impossible LiveCode (oneoff tests).
#
# Round 1 (base model):
#   python scripts/train.py --config-name train/local_ei_livecode
#
# Round N (from checkpoint):
#   python scripts/train.py --config-name train/local_ei_livecode \
#       model=qwen3_8b_ckpt \
#       model.model_name_or_path=/path/to/prev/checkpoint \
#       training.model_name_or_path=/path/to/prev/checkpoint
defaults:
  - /components/model: qwen3_8b
  - /components/dataset: impossible_livecode
  - /components/training: local
  - /components/selection: best_of_n
  - /components/evaluation: impossible_livecode
  - _self_

# ---- global settings ----
seed: 42
dataset_seed: ${seed}
training_seed: ${seed}
device: auto

# ---- dataset ----
dataset:
  test_split: oneoff   # off-by-one mutated tests

# ---- training overrides ----
training:
  generation_context: do_not_hack

# ---- hydra output ----
hydra:
  run:
    dir: experiments/training/local_ei_livecode/${now:%Y-%m-%d_%H-%M-%S}
