# @package _global_
# Expert iteration with Tinker: rollout generation + Tinker managed LoRA SFT.
#
# Uses TinkerModel for both generation and training by default.
# To use vLLM for generation instead:
#   python scripts/train.py --config-name train/tinker_ei model=qwen3_8b
defaults:
  - /components/model: tinker_llama
  - /components/dataset: code_generation
  - /components/training: tinker
  - /components/selection: best_of_n
  - /components/evaluation: code_generation
  - _self_

# ---- global settings ----
seed: 42
dataset_seed: ${seed}
training_seed: ${seed}
device: auto

# ---- dataset ----
dataset:
  use_incorrect_tests: true

# ---- training overrides ----
training:
  generation_context: do_not_hack

# ---- hydra output ----
hydra:
  run:
    dir: experiments/training/tinker_ei/${now:%Y-%m-%d_%H-%M-%S}
